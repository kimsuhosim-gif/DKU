<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 걷기·콤보 모션 검토</title><style>body{font:16px system-ui;background:#14232b;color:#eee;margin:24px}a{color:#83dedc}button{padding:10px 16px;margin:5px;background:#29434b;color:white;border:1px solid #71918e;border-radius:6px}button:focus-visible{outline:3px solid #ffd88a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0;background:white;color:#223b40;border-radius:10px;overflow:hidden}canvas{width:100%;display:block}figcaption{padding:10px}p{max-width:900px;line-height:1.6}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}body{margin:12px}}</style><h1>걷기 · 2타 · 3타</h1><p>캐릭터별 14프레임. 새 그림의 자세와 연결을 확인하는 화면이야. 전투 속도는 실제 게임에서 타격 시점에 맞춰 재생돼.</p><button id="toggle">재생 / 정지</button><button id="next">다음 프레임</button><span id="frame"></span><p><a href="play.html">게임으로 돌아가기</a></p><div class="grid" id="grid"></div><script type="module">
const labels={walk:'걷기',attack2:'2타',attack3:'3타'},items=[];let n=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
for(const id of ['fire','water'])for(const action of ['walk','attack2','attack3']){const f=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=canvas.height=512;caption.textContent=(id==='fire'?'불':'물')+' · '+labels[action];f.append(canvas,caption);document.querySelector('#grid').append(f);const im=new Image();im.src=`motion-v3/${id}/${action}/spritesheet.png`;await im.decode();items.push({canvas,im});}
function draw(){for(const {canvas,im} of items){const c=canvas.getContext('2d');c.clearRect(0,0,512,512);c.drawImage(im,n%7*512,Math.floor(n/7)*512,512,512,0,0,512,512);}document.querySelector('#frame').textContent=`프레임 ${n} / 13`;}
document.querySelector('#toggle').onclick=()=>playing=!playing;document.querySelector('#next').onclick=()=>{playing=false;n=(n+1)%14;draw();};function loop(t){if(playing&&t-last>90){last=t;n=(n+1)%14;draw();}requestAnimationFrame(loop);}draw();requestAnimationFrame(loop);
</script></html>
