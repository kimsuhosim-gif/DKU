<!doctype html><html lang="ko"><meta charset="utf-8"><title>무기별 전투 렌더 검사</title><style>body{margin:0;background:#14242b;color:#fff;font:16px sans-serif}header{padding:12px;position:sticky;top:0;background:#14242b;z-index:2}button{padding:10px;margin:4px}main{display:grid;grid-template-columns:repeat(3,1fr)}article{border:1px solid #65757b}h2{font-size:15px;margin:8px}canvas{width:100%;height:310px;display:block}p{margin:8px}</style><header>아트 검사용 고정 자세 · 승패/플레이 검증과 별도<br><button id="cutin">필살기 컷인</button><button id="superhit">필살기 명중</button><button id="specialRun">필살기 반복 재생</button><button id="special">필살기 타격 정지</button><button id="ready">대기</button><button id="windup">강공격 준비</button><button id="contact">강공격 타격</button><button id="follow">후속 동작</button><button id="light">약공격 타격</button><button id="block">방어 접촉</button><button id="animate">강공격 반복 재생</button></header><main></main><script type="module">
import {RooftopGame} from '/utils/rooftopRenderer.ts';
import {CAST,WEAPONS} from '/utils/rooftopModel.ts';
const main=document.querySelector('main'),games=[];let playing=false,specialPlaying=false,t=0;
const single=new URLSearchParams(location.search).get('cast');if(single!==null){main.style.gridTemplateColumns='1fr';document.head.insertAdjacentHTML('beforeend','<style>canvas{height:540px}header{font-size:12px}button{padding:5px}</style>');}
for(let i=0;i<CAST.length;i++){if(single!==null&&i!==Number(single))continue;const card=document.createElement('article');card.innerHTML=`<h2>${CAST[i].name} · ${WEAPONS[i].name}</h2><canvas></canvas>`;main.append(card);const game=new RooftopGame(card.querySelector('canvas'),()=>{});await game.ready;game.audio.setEnabled(false);game.model.start(i);game.model.fighters=game.model.fighters.slice(0,1);game.model.phase='paused';const p=game.model.fighters[0];Object.assign(p,{x:0,y:210,angle:0});games.push(game);}
function show(kind,progress=.5){for(const g of games){const p=g.model.fighters[0];g.bursts=[];g.specialBursts=[];g.superCue=null;Object.assign(p,{poseTime:kind==='ready'||kind==='block'?0:1-progress,attackDuration:1,attackKind:kind==='light'?'push':'heavy',attackStep:1,guard:kind==='block'?.5:0});if(kind==='contact'||kind==='light'||kind==='block')g.model.events.push({kind:kind==='block'?'save':kind==='light'?'hit':'heavy',x:95,y:210,targetY:210,text:kind==='block'?'BLOCK':'',cast:p.cast,angle:0,jump:0});}}
for(const id of ['ready','windup','contact','follow','light','block'])document.getElementById(id).onclick=()=>{playing=false;show(id,id==='windup'?.25:id==='follow'?.72:.52);};
document.getElementById('cutin').onclick=()=>{playing=false;specialPlaying=false;for(const g of games)g.superCue={cast:g.model.fighters[0].cast,life:.31};};
document.getElementById('superhit').onclick=()=>{playing=false;specialPlaying=false;for(const g of games){g.superCue=null;g.model.events.push({kind:'heavy',x:95,y:210,targetY:210,text:'-40',cast:g.model.fighters[0].cast,angle:0,superHit:true});}};
document.getElementById('special').onclick=()=>{playing=false;specialPlaying=false;for(const g of games){g.superCue=null;g.bursts=[];const p=g.model.fighters[0];Object.assign(p,{poseTime:p.cast===6?.72:.5,attackDuration:p.cast===6?1.2:1,attackKind:'special',guard:0,specialLeft:0});g.specialBursts=[{x:p.x,y:p.y,cast:p.cast,angle:0,life:p.cast===6?.61:.45}];}};
document.getElementById('specialRun').onclick=()=>{specialPlaying=!specialPlaying;playing=false;t=0;};
document.getElementById('animate').onclick=()=>{playing=!playing;t=0;};
const beats=[.12,.30,.44,.54,.65,.74,.84,.94];for(let i=0;i<8;i++){const b=document.createElement('button');b.textContent=`프레임 ${i+1}`;b.onclick=()=>{playing=false;specialPlaying=false;show('attack',beats[i]);};document.querySelector('header').append(b);}
let last=performance.now();function loop(now){const dt=(now-last)/1000;last=now;if(specialPlaying){t=(t+dt)%1.4;for(const g of games){const p=g.model.fighters[0];Object.assign(p,{poseTime:Math.max(.01,1-t),attackDuration:1,attackKind:'special',specialLeft:0});g.specialBursts=t<.65?[{x:p.x,y:p.y,cast:p.cast,angle:0,life:.65-t}]:[];}}if(playing){t=(t+dt)%1.4;show(t<1?'attack':'ready',Math.min(.99,t));}requestAnimationFrame(loop);}requestAnimationFrame(loop);show('ready');
</script></html>
